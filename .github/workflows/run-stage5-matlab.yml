name: Run MATLAB Stage 5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage5:
    name: Verify continuous interval RCIS certificate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - name: Extract Stage 5 package
        run: unzip -q matlab_multiagent_rcis_stage5.zip
      - uses: matlab-actions/setup-matlab@v3
      - uses: matlab-actions/run-command@v3
        with:
          command: cd matlab_multiagent_rcis_stage5; run_stage5_continuous_certificate
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-stage5-results
          path: matlab_multiagent_rcis_stage5/results_stage5/**
          if-no-files-found: warn
          retention-days: 1
